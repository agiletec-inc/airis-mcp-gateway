[project]
name = "airis-mcp-gateway-api"
version = "2.2.2"
description = "AIRIS MCP Gateway API - Fixes Docker MCP Gateway initialized notification"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.137.1,<1.0.0",
    "uvicorn[standard]>=0.46.0,<1.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.1,<3.0.0",
    "psutil>=7.2.2,<8.0.0",
    "cryptography>=48.0.0,<49.0.0",
    "pyyaml>=6.0.3,<7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "sqlalchemy>=2.0.49,<3.0.0",
    "aiosqlite>=0.22.1,<1.0.0",
    "greenlet>=3.5.0,<4.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["ruff>=0.14,<0.16"]

[tool.ruff]
target-version = "py312"
lint.select = ["E4", "E7", "E9"]
lint.ignore = ["E712"]
# The legacy branch is not formatter-clean; keep this PR scoped to gate adoption.
format.exclude = ["**/*.py"]

[tool.ruff.lint.per-file-ignores]
# Alembic's env.py must extend sys.path before importing the app package.
"alembic/env.py" = ["E402"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
# Bare `pytest` (org quality gate) runs the same suite as the canonical CI;
# integration/ needs stubs wiring and e2e/ needs the Docker stack.
testpaths = ["tests/unit"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]
