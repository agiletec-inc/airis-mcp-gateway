name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Detect which paths changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'apps/api/**'
              - 'pyproject.toml'
              - 'workflows/**'
            typescript:
              - 'apps/gateway-control/**'
              - 'apps/airis-commands/**'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.npmrc'
            shell:
              - 'scripts/airis-gateway'
              - 'scripts/quick-install.sh'
              - 'scripts/test-airis-gateway-smoke.sh'
              - 'scripts/test-compose-references.sh'
              - 'install.sh'
              - '.tasks.d/test.yml'
              - '.tasks.d/dev.yml'
              - 'compose.yaml'
              - 'ops/autostart/**'
              - '.github/workflows/ci.yml'

  # Python tests (only when Python files change)
  test-python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          cd apps/api
          uv pip install --system -e ".[test]"

      - name: Run tests with coverage
        run: |
          cd apps/api
          python -m pytest tests/unit -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: apps/api/coverage.xml
          flags: python
          fail_ci_if_error: false

      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r apps/api/src -ll -ii

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install --upgrade pip pip-audit
          cd apps/api
          pip-audit --skip-editable

  # TypeScript build and test (only when TS files change)
  build-typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        # --frozen-lockfile fails the build if pnpm-lock.yaml is out of sync
        # with the manifests instead of silently drifting.
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm -r run test

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Build
        run: pnpm -r run build

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  test-shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run airis-gateway smoke tests
        run: bash scripts/test-airis-gateway-smoke.sh

      - name: Run compose reference tests
        run: bash scripts/test-compose-references.sh

