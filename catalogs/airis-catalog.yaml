version: 2
name: airis-custom
displayName: Airis Custom MCP Catalog
registry:
  # === AIRIS CORE SERVERS ===

  # NOTE: airis-agent has been integrated into airis-mcp-gateway as native tools
  # (airis-confidence, airis-repo-index, airis-suggest, airis-route)

  # DISABLED (issue #193): mindbase is `policy_disabled: true` in
  # mcp-config.json — never authorized for this deployment, and must never
  # auto-enable even via COLD lazy-start. This catalog entry is kept so the
  # Docker MCP Gateway definition matches the real image/config, but it must
  # NOT be advertised as discoverable/callable while the registry entry is
  # policy-disabled. `dynamic_mcp.py` / `toolset_catalog.py` filter only
  # `policy_disabled` servers out of airis-find results at runtime via
  # `is_discoverable()` — plain `enabled: false` COLD/lazy servers (e.g.
  # stripe) are NOT filtered, since they auto-enable transparently on first
  # call. This comment documents why the mindbase entry still exists here.
  mindbase:
    title: MindBase MCP Server
    description: Mindbase knowledge graph operations with vector search
    type: server
    image: ghcr.io/agiletec-inc/mindbase-mcp:latest
    command: ["node", "dist/index.js"]
    category: AIRIS Core
    readme: https://github.com/kazuph/mindbase
    tools:
      - name: store_memory
      - name: search_memories
      - name: list_memories
      - name: delete_memory
    config:
      - name: mindbase_settings
        type: object
        properties:
          database_url:
            type: string
            description: PostgreSQL connection string with pgvector
          ollama_url:
            type: string
            description: Ollama server URL for embeddings
          embedding_model:
            type: string
            description: Embedding model name
    env:
      - name: DATABASE_URL
        value: '{{mindbase_settings.database_url|default:"postgresql://mindbase:mindbase@mindbase-postgres-dev:5432/mindbase"}}'
      - name: OLLAMA_URL
        value: '{{mindbase_settings.ollama_url|default:"http://host.docker.internal:11434"}}'
      - name: EMBEDDING_MODEL
        value: "qwen3-embedding:0.6b"
    allowHosts:
      - "*"

  # === SESSION & RESEARCH SERVERS ===

  serena:
    title: Serena (Session Persistence)
    description: Session state persistence and restoration. Enables PDCA cycle with cross-session memory.
    type: process
    command: ["serena", "start-mcp-server"]
    category: Session Management
    readme: https://github.com/oraios/serena
    tools:
      - name: list_memories
      - name: read_memory
      - name: write_memory
      - name: delete_memory

  tavily:
    title: Tavily (Deep Web Search)
    description: Web search with summarization. Rate-controlled, cached results for deep research.
    type: process
    command: ["npx", "tavily-mcp@latest"]
    category: Research
    readme: https://docs.tavily.com
    tools:
      - name: search
      - name: extract
    config:
      - name: tavily_api_key
        type: string
        description: Tavily API key
        required: true
    env:
      - name: TAVILY_API_KEY
        value: '{{tavily_api_key}}'

  # === INFRASTRUCTURE SERVERS ===

  # NOTE: cloudflare was removed (issue #193) — no cloudflare entry exists in
  # mcp-config.json and registering one requires API credentials, which is a
  # human decision. Re-add here only alongside a real mcp-config.json entry.

