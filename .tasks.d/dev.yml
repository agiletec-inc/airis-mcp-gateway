version: '3'

vars:
  COMPOSE_FILE: "{{.REPO_ROOT}}/compose.yaml"

tasks:
  up:
    desc: Start stack built from local source (docker:up pulls the prebuilt image instead)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build

  down:
    desc: Stop the stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  restart:
    desc: Rebuild and restart the API from local source
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --build api

  logs:
    desc: Follow API logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f api

  build:local:
    desc: Build the bundled TypeScript MCP servers
    cmds:
      - task: build:mcp

  watch:
    desc: Watch and rebuild MCP servers on change
    cmds:
      - |
        echo "Watching for TypeScript changes..."
        watchexec -w {{.REPO_ROOT}}/apps/airis-commands/src \
                  -w {{.REPO_ROOT}}/apps/gateway-control/src \
                  -- task build:mcp
