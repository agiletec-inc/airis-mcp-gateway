version: '3'

tasks:
  mcp:
    desc: Build all MCP servers (pnpm workspace)
    dir: "{{.REPO_ROOT}}"
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm -r run build

  typecheck:
    desc: Run TypeScript type checking
    dir: "{{.REPO_ROOT}}"
    cmds:
      - pnpm -r run typecheck

  clean:
    desc: Clean all build artifacts
    dir: "{{.REPO_ROOT}}"
    cmds:
      - rm -rf apps/airis-commands/dist apps/airis-commands/node_modules
      - rm -rf apps/gateway-control/dist apps/gateway-control/node_modules
      - rm -rf node_modules
      - echo "Build artifacts cleaned"
