version: '3'

tasks:
  health:
    desc: Check API health
    cmds:
      - curl -sf http://localhost:9400/health | jq .

  status:
    desc: Check server status
    cmds:
      - curl -sf http://localhost:9400/api/tools/status | jq '.servers[] | {name, status, tools_count}'

  tools:
    desc: List all available tools
    cmds:
      - curl -sf http://localhost:9400/api/tools/combined | jq '{tools_count, sources}'

  tools:count:
    desc: Count total tools
    cmds:
      - curl -sf http://localhost:9400/api/tools/combined | jq '.tools_count'

  prewarm:
    desc: Check pre-warm status from logs
    cmds:
      - docker compose logs api 2>&1 | grep -E "Pre-warm" | tail -10

  e2e:
    desc: Run end-to-end test suite (against a running `docker compose up -d` stack)
    # E2E_STRICT=1: the documented e2e entrypoint must be strict. Without it,
    # tests/e2e/test_mcp_servers_e2e.py silently `pytest.skip()`s on timeouts
    # instead of failing, so a green `task test:e2e` could mean "everything
    # timed out" instead of "the stack is healthy" (issue #195). Casual local
    # runs of `pytest tests/e2e` directly (not through this task) still skip.
    env:
      E2E_STRICT: "1"
    cmds:
      - echo "=== Gateway Health ==="
      - task: health
      - echo ""
      - echo "=== Server Status ==="
      - task: status
      - echo ""
      - echo "=== Tool Count ==="
      - task: tools:count
      - echo ""
      - echo "=== Pre-warm Status ==="
      - task: prewarm
      - echo ""
      - echo "=== Pytest E2E Suite (strict) ==="
      - cd apps/api && uv run --extra test python -m pytest tests/e2e -v
      - echo ""
      - echo "✓ All checks passed"

  api:
    desc: Run Python API tests
    cmds:
      - docker compose exec api pytest tests/ -v

  airis-mcp-gateway:
    desc: Run airis-mcp-gateway smoke tests
    cmds:
      - bash scripts/test-airis-mcp-gateway-smoke.sh
