version: '3'

vars:
  COMPOSE_FILE: "{{.REPO_ROOT}}/docker-compose.yml"
  ARM_EMU_FILE: "{{.REPO_ROOT}}/docker-compose.arm-emu.yml"
  COMPOSE_FILES:
    sh: |
      case "$(uname -m)" in
        x86_64|amd64)
          echo "-f {{.COMPOSE_FILE}} -f {{.ARM_EMU_FILE}}" ;;
        *)
          echo "-f {{.COMPOSE_FILE}}" ;;
      esac

tasks:
  qemu-setup:
    desc: Register QEMU binfmt handlers for ARM64 emulation (x86_64 only)
    platforms: [linux/amd64]
    status:
      - test -f /proc/sys/fs/binfmt_misc/qemu-aarch64
    cmds:
      - echo "Registering QEMU binfmt handlers for ARM64 emulation..."
      - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

  up:
    desc: Start the stack
    deps: [qemu-setup]
    cmds:
      - docker compose {{.COMPOSE_FILES}} up -d

  down:
    desc: Stop the stack
    cmds:
      - docker compose {{.COMPOSE_FILES}} down

  restart:
    desc: Restart the API container
    cmds:
      - docker compose {{.COMPOSE_FILES}} restart api

  ps:
    desc: Show container status
    cmds:
      - docker compose {{.COMPOSE_FILES}} ps

  logs:
    desc: Follow API logs
    cmds:
      - docker compose {{.COMPOSE_FILES}} logs -f api

  logs:all:
    desc: Follow all container logs
    cmds:
      - docker compose {{.COMPOSE_FILES}} logs -f

  logs:tail:
    desc: Show last 50 log lines
    cmds:
      - docker compose {{.COMPOSE_FILES}} logs --tail 50 api

  build:
    desc: Build Docker images
    deps: [qemu-setup]
    cmds:
      - docker compose {{.COMPOSE_FILES}} build

  build:nocache:
    desc: Build Docker images without cache
    deps: [qemu-setup]
    cmds:
      - docker compose {{.COMPOSE_FILES}} build --no-cache

  pull:
    desc: Pull latest images
    cmds:
      - docker compose {{.COMPOSE_FILES}} pull

  clean:
    desc: Stop and remove all containers, volumes
    cmds:
      - docker compose {{.COMPOSE_FILES}} down -v

  shell:
    desc: Shell into API container
    cmds:
      - docker compose {{.COMPOSE_FILES}} exec api /bin/bash
